name: YAAS Android Release

on:
  workflow_dispatch:
  push:
    branches:
      - android-port
      - master

jobs:
  android-release:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          build-warnings: ""

      - name: Install Rinf CLI
        run: |
          cargo install rinf_cli --version 8.10.1 --locked
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          rinf --help

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12266719
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: true
          packages: platform-tools platforms;android-35 build-tools;35.0.0 ndk;28.2.13676358

      - name: Set Android SDK variables
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Check Internet
        run: |
          set -e

          curl -I --max-time 20 https://github.com
          curl -I --max-time 20 https://pub.dev

          echo "Internet connection OK"

      - name: Check Android SDK
        run: |
          set -e

          sdkmanager --list | head -100

          adb version

          "$ANDROID_HOME/build-tools/35.0.0/aapt2" version

          echo "Android SDK check OK"

      - name: Create Android platform
        run: |
          if [ ! -f android/app/build.gradle ] && [ ! -f android/app/build.gradle.kts ]; then
            flutter create --platforms=android --org com.skrimix .
          fi

      - name: Add Internet permission
        run: |
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")

          if not manifest.exists():
              raise SystemExit("AndroidManifest.xml not found")

          text = manifest.read_text()

          permission = '<uses-permission android:name="android.permission.INTERNET"/>'

          if "android.permission.INTERNET" not in text:
              text = text.replace(
                  "<application",
                  permission + "\n    <application",
                  1
              )
              manifest.write_text(text)

          print("INTERNET permission checked")
          PY

      - name: Flutter Doctor
        run: flutter doctor -v

      - name: Flutter dependencies
        run: flutter pub get --enforce-lockfile

      - name: Generate Rinf bindings
        run: |
          rinf gen

          test -f lib/src/bindings/bindings.dart
          test -f lib/src/bindings/signals/signals.dart

          echo "Rinf bindings generated successfully"

      - name: Generate localization
        run: flutter gen-l10n

      - name: Test Rclone
        run: |
          cargo test --locked -p hub downloader::rclone

      - name: Test Rclone config refresh
        run: |
          cargo test --locked -p hub manual_refresh_updates_runtime_files_at_unchanged_urls

      - name: Flutter tests
        run: flutter test

      - name: Clean Flutter
        run: flutter clean

      - name: Restore Flutter dependencies
        run: flutter pub get --enforce-lockfile

      - name: Regenerate Rinf bindings
        run: |
          rinf gen

          test -f lib/src/bindings/bindings.dart
          test -f lib/src/bindings/signals/signals.dart

      - name: Regenerate localization
        run: flutter gen-l10n

      - name: Verify Android project
        run: |
          test -f android/app/build.gradle || test -f android/app/build.gradle.kts
          test -f android/app/src/main/AndroidManifest.xml
          grep -q "android.permission.INTERNET" android/app/src/main/AndroidManifest.xml

          echo "Android project OK"
          echo "Internet permission OK"

      - name: Build Android ARM64 APK
        run: |
          flutter build apk \
            --release \
            --target-platform android-arm64

      - name: Verify APK exists
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"

          test -f "$APK"

          echo "APK found:"
          ls -lh "$APK"

      - name: Verify APK integrity
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"

          unzip -tq "$APK"

          echo "APK ZIP integrity OK"

      - name: Verify APK permissions
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"

          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump permissions "$APK" \
            | tee apk-permissions.txt

          grep -q "android.permission.INTERNET" apk-permissions.txt

          echo "INTERNET permission is present"

      - name: Verify APK architecture
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"

          unzip -l "$APK" | grep "lib/arm64-v8a/" || {
            echo "ARM64 native libraries were not found"
            exit 1
          }

          echo "ARM64 architecture OK"

      - name: Verify APK alignment
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"

          "$ANDROID_HOME/build-tools/35.0.0/zipalign" \
            -c -P 16 -v 4 "$APK"

      - name: Verify APK signature
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify \
            --verbose "$APK"

      - name: APK information
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"

          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging "$APK" \
            | tee apk-badging.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: YAAS-Android-Release-arm64
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Upload APK report
        uses: actions/upload-artifact@v4
        with:
          name: YAAS-Android-APK-Report
          path: |
            apk-permissions.txt
            apk-badging.txt
          retention-days: 30