
name: YAAS Android Release

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: yaas-android-release
  cancel-in-progress: false

jobs:
  build:
    name: Build Android ARM64 Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install Rinf CLI
        run: cargo install rinf_cli --version 8.10.1 --locked

      - name: Generate Android project
        run: |
          if [ ! -d android ]; then
            flutter create \
              --platforms=android \
              --org com.yaas \
              --project-name yaas .
          fi

      - name: Generate Rinf bindings
        run: rinf gen

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Clean previous build
        run: flutter clean

      - name: Get dependencies again
        run: flutter pub get

      - name: Build APK ARM64 Release
        run: |
          flutter build apk \
            --release \
            --target-platform android-arm64

      - name: Verify APK
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK not found!"
            exit 1
          fi

          echo "APK successfully built!"
          ls -lh "$APK"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v${{ github.run_number }}
          name: YAAS Android Release v${{ github.run_number }}
          generate_release_notes: true
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
