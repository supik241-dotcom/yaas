
name: YAAS Android Release

on:
  workflow_dispatch:
  push:
    branches:
      - android-port
      - master

permissions:
  contents: read

jobs:
  build-android:
    name: Build and verify Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      # 1. Исходники
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Java
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true

      # 4. Rust
      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          build-warnings: ""

      # 5. Rinf CLI и Cargo NDK
      - name: Install Rust tools
        run: |
          cargo install rinf_cli --version 8.10.1 --locked
          cargo install cargo-ndk --locked

          rustup target add aarch64-linux-android

          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

          rinf --help
          cargo ndk --help

      # 6. Android SDK и NDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android components
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;28.2.13676358"

          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_PATH"

      # 7. Проверка интернета на сервере сборки
      - name: Check Internet connection
        run: |
          echo "Checking GitHub..."
          curl -fsSI --retry 3 --max-time 30 https://github.com

          echo "Checking pub.dev..."
          curl -fsSI --retry 3 --max-time 30 https://pub.dev

          echo "Internet connection: OK"

      # 8. Создание Android-проекта
      - name: Generate Android project
        run: |
          if [ ! -f android/app/build.gradle ] && \
             [ ! -f android/app/build.gradle.kts ]; then
            flutter create --platforms=android --org com.skrimix .
          fi

          test -d android
          test -d android/app

      # 9. Разрешение доступа к интернету для APK
      - name: Enable Android Internet permission
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("android/app/src/main/AndroidManifest.xml")
          content = path.read_text()

          permission = 'android.permission.INTERNET'

          if permission not in content:
              content, count = re.subn(
                  r'(<application\b)',
                  '    <uses-permission android:name="android.permission.INTERNET" />\n    \\1',
                  content,
                  count=1
              )

              if count != 1:
                  raise SystemExit("Could not insert INTERNET permission")

              path.write_text(content)

          if permission not in path.read_text():
              raise SystemExit("INTERNET permission is missing")

          print("Android INTERNET permission: OK")
          PY

      # 10. Проверка Flutter
      - name: Flutter Doctor
        run: flutter doctor -v

      # 11. Получение зависимостей
      - name: Flutter Pub Get
        run: flutter pub get --enforce-lockfile

      # 12. Генерация Rinf
      - name: Generate Rinf bindings
        run: |
          rinf gen

          test -f lib/src/bindings/bindings.dart
          test -f lib/src/bindings/signals/signals.dart

          echo "Rinf bindings: OK"

      # 13. Генерация локализации
      - name: Generate localization
        run: flutter gen-l10n

      # 14. Проверка Rclone
      - name: Test Rclone
        run: |
          cargo test --locked -p hub downloader::rclone

      # 15. Проверка обновления конфигурации Rclone
      - name: Test Rclone configuration refresh
        run: |
          cargo test --locked -p hub \
            manual_refresh_updates_runtime_files_at_unchanged_urls

      # 16. Проверка Flutter
      - name: Flutter tests
        run: flutter test

      # 17. Очистка
      - name: Flutter Clean
        run: flutter clean

      # 18. Повторная подготовка
      - name: Prepare Flutter
        run: |
          flutter pub get --enforce-lockfile
          rinf gen
          flutter gen-l10n

      # 19. Проверка Android-файлов
      - name: Verify Android project
        run: |
          test -f android/app/build.gradle || \
          test -f android/app/build.gradle.kts

          test -f android/app/src/main/AndroidManifest.xml

          grep -q "android.permission.INTERNET" \
            android/app/src/main/AndroidManifest.xml

          echo "Android project: OK"

      # 20. Сборка Release APK
      - name: Build Release APK
        run: |
          flutter build apk \
            --release \
            --target-platform android-arm64

      # 21. Поиск APK
      - name: Locate APK
        run: |
          find build/app/outputs/flutter-apk \
            -type f -name "*.apk"

          test -f build/app/outputs/flutter-apk/app-release.apk

      # 22. Подготовка проверки APK
      - name: Prepare APK verification
        run: |
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"

          echo "BUILD_TOOLS=$BUILD_TOOLS" >> "$GITHUB_ENV"

          "$BUILD_TOOLS/aapt2" version
          "$BUILD_TOOLS/apksigner" --version

      # 23. Проверка APK
      - name: Verify APK
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"

          echo "===== APK INFORMATION ====="
          ls -lh "$APK"

          echo "===== ZIP INTEGRITY ====="
          unzip -tq "$APK"

          echo "===== ANDROID MANIFEST ====="
          "$BUILD_TOOLS/aapt2" dump permissions "$APK"

          "$BUILD_TOOLS/aapt2" dump permissions "$APK" \
            | grep -q "android.permission.INTERNET"

          echo "INTERNET permission: OK"

          echo "===== APK PACKAGE ====="
          "$BUILD_TOOLS/aapt2" dump badging "$APK" \
            | tee apk-badging.txt

          grep -q "^package:" apk-badging.txt

          echo "===== ARM64 CHECK ====="
          unzip -Z1 "$APK" | grep "lib/arm64-v8a/"

          unzip -Z1 "$APK" \
            | grep -q "^lib/arm64-v8a/"

          echo "ARM64: OK"

          echo "===== ZIPALIGN CHECK ====="
          "$BUILD_TOOLS/zipalign" \
            -c -P 16 -v 4 "$APK"

          echo "ZIPALIGN: OK"

          echo "===== SIGNATURE CHECK ====="
          "$BUILD_TOOLS/apksigner" verify \
            --verbose \
            --print-certs "$APK"

          echo "SIGNATURE: OK"

          echo "===== ALL APK CHECKS PASSED ====="

      # 24. Сохраняем APK
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: YAAS-Android-Release-arm64
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      # 25. Сохраняем отчёт проверки
      - name: Upload APK verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: YAAS-Android-verification
          path: apk-badging.txt
          if-no-files-found: ignore
          retention-days: 30
