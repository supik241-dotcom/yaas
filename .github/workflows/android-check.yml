
name: Android APK Check

on:
  workflow_dispatch:
  push:
    branches:
      - android-port

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        run: flutter create --platforms=android --org com.yaas .

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --debug
