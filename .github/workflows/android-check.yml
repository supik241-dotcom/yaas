
name: YAAS Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - android-port

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout YAAS
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Rinf CLI
        run: cargo install rinf_cli --locked

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        run: |
          flutter create \
            --platforms=android \
            --org com.yaas \
            .

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: true

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses

      - name: Install Android NDK
        run: sdkmanager "ndk;28.2.13676358"

      - name: Configure Android manifest and native libraries
        shell: bash
        run: |
          set -euo pipefail

          MANIFEST="android/app/src/main/AndroidManifest.xml"
          KTS="android/app/build.gradle.kts"
          GROOVY="android/app/build.gradle"

          test -f "$MANIFEST"

          if ! grep -q 'android.permission.INTERNET' "$MANIFEST"; then
            sed -i '/<manifest[^>]*>/a\    <uses-permission android:name="android.permission.INTERNET" />' "$MANIFEST"
          fi

          if grep -q 'android:extractNativeLibs=' "$MANIFEST"; then
            sed -i 's/android:extractNativeLibs="[^"]*"/android:extractNativeLibs="true"/' "$MANIFEST"
          else
            sed -i 's/<application/<application android:extractNativeLibs="true"/' "$MANIFEST"
          fi

          if [ -f "$KTS" ]; then
            cat >> "$KTS" <<'EOF'

          android {
              packaging {
                  jniLibs {
                      useLegacyPackaging = true
                  }
              }
              lint {
                  checkReleaseBuilds = false
                  abortOnError = false
              }
          }
          EOF
          elif [ -f "$GROOVY" ]; then
            cat >> "$GROOVY" <<'EOF'

          android {
              packaging {
                  jniLibs {
                      useLegacyPackaging true
                  }
              }
              lint {
                  checkReleaseBuilds false
                  abortOnError false
              }
          }
          EOF
          else
            echo "Android Gradle file not found"
            exit 1
          fi

          echo "Android manifest:"
          cat "$MANIFEST"

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Generate Rinf bindings
        run: |
          rinf gen
          test -s lib/src/bindings/bindings.dart
          test -s lib/src/bindings/signals/signals.dart

      - name: Build RELEASE APK
        run: |
          flutter build apk \
            --release \
            --target-platform android-arm64

      - name: Check APK exists
        shell: bash
        run: |
          set -euo pipefail

          APK="build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -s "$APK" ]; then
            echo "ERROR: Release APK was not created"
            find build -type f -name "*.apk" -print
            exit 1
          fi

          ls -lh "$APK"

      - name: Verify native libraries
        shell: bash
        run: |
          set -euo pipefail

          APK="build/app/outputs/flutter-apk/app-release.apk"

          echo "Checking libhub.so..."
          unzip -Z1 "$APK" | grep -E '(^|/)libhub\.so$'

          echo "Checking Android native libraries..."
          unzip -Z1 "$APK" | grep '^lib/arm64-v8a/'

      - name: Verify Internet permission
        shell: bash
        run: |
          set -euo pipefail

          APK="build/app/outputs/flutter-apk/app-release.apk"

          AAPT2=$(find "$ANDROID_HOME/build-tools" \
            -type f -name "aapt2" | sort -V | tail -n 1)

          test -n "$AAPT2"

          "$AAPT2" dump permissions "$APK" | tee apk-permissions.txt

          grep -Fq 'android.permission.INTERNET' apk-permissions.txt

      - name: Verify APK integrity
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"
          unzip -t "$APK"
          sha256sum "$APK"

      - name: Verify APK signature
        shell: bash
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" \
            -type f -name "apksigner" | sort -V | tail -n 1)

          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: YAAS-Android-Release-arm64
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-release-${{ github.run_number }}
          name: YAAS Android Release ${{ github.run_number }}
          body: |
            YAAS Android Release
            Target: Android ARM64
            Build type: Release
          files: |
            build/app/outputs/flutter-apk/app-release.apk
          prerelease: true
          make_latest: false
