name: YAAS Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - android-port

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # =========================
      # 1. Checkout
      # =========================
      - name: Checkout YAAS
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # =========================
      # 2. Java
      # =========================
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # =========================
      # 3. Rust
      # =========================
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # =========================
      # 4. Rinf
      # =========================
      - name: Install Rinf CLI
        run: cargo install rinf_cli --locked

      # =========================
      # 5. Flutter
      # =========================
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # =========================
      # 6. Generate Android project
      # =========================
      - name: Generate Android project
        run: |
          flutter create \
            --platforms=android \
            --org com.yaas \
            .

      # =========================
      # 7. Android SDK
      # =========================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: true

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses

      # =========================
      # 8. Android NDK
      # =========================
      - name: Install Android NDK
        run: |
          sdkmanager "ndk;28.2.13676358"

      # =========================
      # 9. Disable broken release Lint
      # =========================
      - name: Disable release Lint
        shell: bash
        run: |
          KTS="android/app/build.gradle.kts"
          GROOVY="android/app/build.gradle"

          if [ -f "$KTS" ]; then
            cat >> "$KTS" <<'EOF'

          // YAAS Android build:
          // video_player_android currently crashes Android Lint
          // during lintVitalAnalyzeRelease.
          android {
              lint {
                  checkReleaseBuilds = false
                  abortOnError = false
              }
          }
          EOF

            echo "Added release Lint configuration to build.gradle.kts"

          elif [ -f "$GROOVY" ]; then
            cat >> "$GROOVY" <<'EOF'

          // YAAS Android build:
          // video_player_android currently crashes Android Lint
          // during lintVitalAnalyzeRelease.
          android {
              lint {
                  checkReleaseBuilds false
                  abortOnError false
              }
          }
          EOF

            echo "Added release Lint configuration to build.gradle"

          else
            echo "ERROR: Android Gradle file not found"
            exit 1
          fi

      # =========================
      # 10. Flutter dependencies
      # =========================
      - name: Get Flutter dependencies
        run: |
          flutter pub get

      # =========================
      # 11. Generate Rinf bindings
      # =========================
      - name: Generate Rinf bindings
        run: |
          rinf gen

      # =========================
      # 12. Check Rinf
      # =========================
      - name: Check generated bindings
        run: |
          test -s lib/src/bindings/bindings.dart
          test -s lib/src/bindings/signals/signals.dart

          echo "Rinf bindings OK"

      # =========================
      # 13. Clean
      # =========================
      - name: Flutter clean
        run: |
          flutter clean
          flutter pub get
          rinf gen

      # =========================
      # 14. Build RELEASE APK
      # =========================
      - name: Build release APK
        run: |
          flutter build apk --release

      # =========================
      # 15. Find APK
      # =========================
      - name: Check APK exists
        shell: bash
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -s "$APK" ]; then
            echo "ERROR: APK was not created"

            echo
            echo "Available APK files:"
            find build -type f -name "*.apk" -print

            exit 1
          fi

          echo "================================"
          echo "APK CREATED SUCCESSFULLY"
          echo "================================"

          ls -lh "$APK"

      # =========================
      # 16. APK integrity
      # =========================
      - name: Verify APK integrity
        shell: bash
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"

          echo "===== FILE ====="
          file "$APK"

          echo
          echo "===== SHA256 ====="
          sha256sum "$APK"

          echo
          echo "===== ZIP TEST ====="
          unzip -t "$APK"

      # =========================
      # 17. Verify signature
      # =========================
      - name: Verify APK signature
        shell: bash
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" \
            -type f \
            -name "apksigner" \
            | sort -V \
            | tail -n 1)

          if [ -z "$APKSIGNER" ]; then
            echo "ERROR: apksigner not found"
            exit 1
          fi

          echo "Using apksigner:"
          echo "$APKSIGNER"

          "$APKSIGNER" verify --verbose "$APK"

      # =========================
      # 18. APK package information
      # =========================
      - name: Inspect APK
        shell: bash
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"

          AAPT2=$(find "$ANDROID_HOME/build-tools" \
            -type f \
            -name "aapt2" \
            | sort -V \
            | tail -n 1)

          if [ -z "$AAPT2" ]; then
            echo "ERROR: aapt2 not found"
            exit 1
          fi

          "$AAPT2" dump badging "$APK" | head -n 50

      # =========================
      # 19. GitHub Release
      # =========================
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-release-${{ github.run_number }}
          name: YAAS Android Release ${{ github.run_number }}
          body: |
            YAAS Android Release

            Commit:
            ${{ github.sha }}

            Flutter:
            stable

            Build:
            Release APK

            Target:
            Android ARM64

            Release Lint disabled because
            video_player_android currently crashes
            Android Lint during release analysis.
          files: |
            build/app/outputs/flutter-apk/app-release.apk
          prerelease: true
          make_latest: false