
name: Android APK Check

on:
  workflow_dispatch:
  push:
    branches:
      - android-port

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Rinf CLI
        run: cargo install rinf_cli --locked

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        run: flutter create --platforms=android --org com.yaas .

      - name: Get dependencies
        run: flutter pub get

      - name: Generate Rinf bindings
        run: rinf gen

      - name: Check generated files
        run: |
          test -f lib/src/bindings/bindings.dart
          test -f lib/src/bindings/signals/signals.dart

      - name: Build APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: yaas-android-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
