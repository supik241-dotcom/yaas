name: Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - android-port

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Rinf CLI
        run: cargo install rinf_cli --locked

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        run: flutter create --platforms=android --org com.yaas .

      - name: Get dependencies
        run: flutter pub get

      - name: Generate Rinf bindings
        run: rinf gen

      - name: Check generated files
        run: |
          test -f lib/src/bindings/bindings.dart
          test -f lib/src/bindings/signals/signals.dart

      - name: Build APK
        run: flutter build apk --debug

      - name: Verify APK
        run: |
          APK=build/app/outputs/flutter-apk/app-debug.apk

          test -s "$APK"

          echo "APK information:"
          ls -lh "$APK"
          file "$APK"

          echo "APK SHA256:"
          sha256sum "$APK"

          echo "APK ZIP integrity:"
          unzip -t "$APK"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-build-${{ github.run_number }}
          name: YAAS Android Build ${{ github.run_number }}
          body: |
            YAAS Android debug build.

            Commit:
            ${{ github.sha }}

            This APK was built automatically by GitHub Actions.
          files: build/app/outputs/flutter-apk/app-debug.apk
          prerelease: true
          make_latest: false