name: YAAS Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - android-port

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # =========================
      # 1. YAAS
      # =========================
      - name: Checkout YAAS
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # =========================
      # 2. Java
      # =========================
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # =========================
      # 3. Rust
      # =========================
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # =========================
      # 4. Rinf
      # =========================
      - name: Install Rinf CLI
        run: cargo install rinf_cli --locked

      # =========================
      # 5. Flutter
      # =========================
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # =========================
      # 6. Android project
      # =========================
      - name: Generate Android project
        run: |
          flutter create \
            --platforms=android \
            --org com.yaas \
            .

      # =========================
      # 7. Android SDK
      # =========================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: true

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses

      # =========================
      # 8. Android NDK
      # =========================
      - name: Install Android NDK
        run: |
          sdkmanager "ndk;28.2.13676358"

      # =========================
      # 9. Flutter dependencies
      # =========================
      - name: Get Flutter dependencies
        run: |
          flutter pub get

      # =========================
      # 10. Generate Rinf bindings
      # =========================
      - name: Generate Rinf bindings
        run: |
          rinf gen

      # =========================
      # 11. Check bindings
      # =========================
      - name: Check generated bindings
        run: |
          echo "Checking Rinf bindings..."

          test -s lib/src/bindings/bindings.dart
          test -s lib/src/bindings/signals/signals.dart

          echo "Rinf bindings OK"

      # =========================
      # 12. Flutter doctor
      # =========================
      - name: Flutter doctor
        run: |
          flutter doctor -v

      # =========================
      # 13. Build RELEASE APK
      # =========================
      - name: Build Android Release APK
        run: |
          flutter clean
          flutter pub get
          rinf gen

          flutter build apk --release

      # =========================
      # 14. Find APK
      # =========================
      - name: Check APK
        shell: bash
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK not found"
            find build -type f -name "*.apk" -print
            exit 1
          fi

          echo "=============================="
          echo "APK FOUND"
          echo "=============================="

          ls -lh "$APK"

          echo
          echo "FILE:"
          file "$APK"

          echo
          echo "SHA256:"
          sha256sum "$APK"

          echo
          echo "ZIP TEST:"
          unzip -t "$APK"

      # =========================
      # 15. Verify APK signature
      # =========================
      - name: Verify APK signature
        shell: bash
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" \
            -type f \
            -name "apksigner" \
            | sort -V \
            | tail -n 1)

          if [ -z "$APKSIGNER" ]; then
            echo "ERROR: apksigner not found"
            exit 1
          fi

          echo "Using:"
          echo "$APKSIGNER"

          echo
          echo "APK SIGNATURE:"
          "$APKSIGNER" verify --verbose "$APK"

      # =========================
      # 16. APK information
      # =========================
      - name: Check APK package
        shell: bash
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"

          AAPT2=$(find "$ANDROID_HOME/build-tools" \
            -type f \
            -name "aapt2" \
            | sort -V \
            | tail -n 1)

          if [ -z "$AAPT2" ]; then
            echo "ERROR: aapt2 not found"
            exit 1
          fi

          echo "APK BADGING:"
          "$AAPT2" dump badging "$APK" | head -n 40

      # =========================
      # 17. Create GitHub Release
      # =========================
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-release-${{ github.run_number }}
          name: YAAS Android Release ${{ github.run_number }}
          body: |
            YAAS Android ARM64 Release

            Commit:
            ${{ github.sha }}

            Build:
            Flutter Release APK

            Architecture:
            ARM64 / arm64-v8a

            This release is the clean Android build
            without the experimental bundled rclone.
          files: |
            build/app/outputs/flutter-apk/app-release.apk
          prerelease: true
          make_latest: false