
name: YAAS Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - android-port

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout YAAS
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Rinf CLI
        run: cargo install rinf_cli --locked

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Setup Go for rclone
        uses: actions/setup-go@v7
        with:
          go-version: "~1.27.0"
          cache: true

      - name: Generate Android project
        run: |
          flutter create \
            --platforms=android \
            --org com.yaas \
            .

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: true

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses

      - name: Install Android NDK
        run: sdkmanager "ndk;28.2.13676358"

      - name: Build bundled Android rclone
        shell: bash
        run: |
          set -euo pipefail

          RCLONE_VERSION="v1.76.0"
          NDK="$ANDROID_HOME/ndk/28.2.13676358"
          RCLONE_DIR="$RUNNER_TEMP/rclone"

          DEST="$GITHUB_WORKSPACE/android/app/src/main/jniLibs/arm64-v8a/librclone.so"

          git clone \
            --depth 1 \
            --branch "$RCLONE_VERSION" \
            https://github.com/rclone/rclone.git \
            "$RCLONE_DIR"

          mkdir -p "$(dirname "$DEST")"

          cd "$RCLONE_DIR"

          export ANDROID_NDK="$NDK"
          export CC="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang"
          export CC_FOR_TARGET="$CC"

          export GOOS=android
          export GOARCH=arm64
          export CGO_ENABLED=1
          export CGO_LDFLAGS="-fuse-ld=lld -s -w"

          go build -v -tags android -trimpath \
            -ldflags="-s -w -X github.com/rclone/rclone/fs.Version=$RCLONE_VERSION" \
            -o "$DEST" .

          chmod 755 "$DEST"

          file "$DEST"
          readelf -h "$DEST" | grep -E 'Class:|Machine:'

      - name: Configure Android manifest
        shell: bash
        run: |
          set -euo pipefail

          MANIFEST="android/app/src/main/AndroidManifest.xml"
          KTS="android/app/build.gradle.kts"
          GROOVY="android/app/build.gradle"

          test -f "$MANIFEST"

          if ! grep -q 'android.permission.INTERNET' "$MANIFEST"; then
            sed -i '/<manifest[^>]*>/a\    <uses-permission android:name="android.permission.INTERNET" />' "$MANIFEST"
          fi

          if grep -q 'android:extractNativeLibs=' "$MANIFEST"; then
            sed -i 's/android:extractNativeLibs="[^"]*"/android:extractNativeLibs="true"/' "$MANIFEST"
          else
            sed -i 's/<application/<application android:extractNativeLibs="true"/' "$MANIFEST"
          fi

          if [ -f "$KTS" ]; then
            cat >> "$KTS" <<'EOF'

          android {
              packaging {
                  jniLibs {
                      useLegacyPackaging = true
                  }
              }
              lint {
                  checkReleaseBuilds = false
                  abortOnError = false
              }
          }
          EOF
          elif [ -f "$GROOVY" ]; then
            cat >> "$GROOVY" <<'EOF'

          android {
              packaging {
                  jniLibs {
                      useLegacyPackaging true
                  }
              }
              lint {
                  checkReleaseBuilds false
                  abortOnError false
              }
          }
          EOF
          else
            echo "Android Gradle file not found"
            exit 1
          fi

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Generate Rinf bindings
        run: |
          rinf gen

          test -s lib/src/bindings/bindings.dart
          test -s lib/src/bindings/signals/signals.dart

      - name: Build RELEASE APK
        run: |
          flutter build apk \
            --release \
            --target-platform android-arm64

      - name: Check APK exists
        shell: bash
        run: |
          set -euo pipefail

          APK="build/app/outputs/flutter-apk/app-release.apk"

          test -s "$APK"

          ls -lh "$APK"

      - name: Verify required native libraries and assets
        shell: bash
        run: |
          set -euo pipefail

          APK="build/app/outputs/flutter-apk/app-release.apk"

          CONTENTS="$(mktemp)"
          unzip -Z1 "$APK" > "$CONTENTS"

          echo "Checking native libraries..."

          grep -Fx 'lib/arm64-v8a/libhub.so' "$CONTENTS"
          grep -Fx 'lib/arm64-v8a/librclone.so' "$CONTENTS"
          grep -Fx 'lib/arm64-v8a/libapp.so' "$CONTENTS"
          grep -Fx 'lib/arm64-v8a/libflutter.so' "$CONTENTS"

          echo "Checking Flutter assets..."

          grep -q '^assets/flutter_assets/AssetManifest' "$CONTENTS"
          grep -q '^assets/flutter_assets/assets/svg/' "$CONTENTS"
          grep -q '^assets/flutter_assets/assets/png/' "$CONTENTS"

          echo "All required files are present."

      - name: Verify Internet permission
        shell: bash
        run: |
          set -euo pipefail

          APK="build/app/outputs/flutter-apk/app-release.apk"

          AAPT2=$(find "$ANDROID_HOME/build-tools" \
            -type f -name "aapt2" | sort -V | tail -n 1)

          test -n "$AAPT2"

          "$AAPT2" dump permissions "$APK" | tee apk-permissions.txt

          grep -Fq 'android.permission.INTERNET' apk-permissions.txt

      - name: Verify APK integrity
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"

          unzip -t "$APK"
          sha256sum "$APK"

      - name: Verify APK signature
        shell: bash
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" \
            -type f -name "apksigner" | sort -V | tail -n 1)

          test -n "$APKSIGNER"

          "$APKSIGNER" verify --verbose "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: YAAS-Android-Release-arm64
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-release-${{ github.run_number }}
          name: YAAS Android Release ${{ github.run_number }}
          body: |
            YAAS Android Release
            Target: Android ARM64
            Build type: Release
            Includes bundled Android rclone.
          files: |
            build/app/outputs/flutter-apk/app-release.apk
          prerelease: true
          make_latest: false
