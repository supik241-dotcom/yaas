name: Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - android-port

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout YAAS
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Rinf CLI
        run: cargo install rinf_cli --locked

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        run: flutter create --platforms=android --org com.yaas .

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: true

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses

      - name: Install Android NDK
        run: sdkmanager "ndk;28.2.13676358"

      - name: Get dependencies
        run: flutter pub get

      - name: Generate Rinf bindings
        run: rinf gen

      - name: Check generated files
        run: |
          echo "Checking Rinf bindings..."
          test -s lib/src/bindings/bindings.dart
          test -s lib/src/bindings/signals/signals.dart
          echo "Rinf bindings OK"

      - name: Build ARM64 APK
        run: flutter build apk --debug --split-per-abi

      - name: Check APK
        run: |
          APK="build/app/outputs/flutter-apk/app-arm64-v8a-debug.apk"

          echo "===== APK FILE ====="
          ls -lh "$APK"

          echo "===== FILE TYPE ====="
          file "$APK"

          echo "===== APK CONTENT ====="
          unzip -t "$APK"

          echo "===== APK SHA256 ====="
          sha256sum "$APK"

          echo "===== APK SIGNATURE ====="
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)

          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --verbose "$APK"
          else
            echo "apksigner not found"
            exit 1
          fi

          echo "===== APK BADGING ====="
          AAPT2=$(find "$ANDROID_HOME/build-tools" -name aapt2 | sort -V | tail -n 1)

          if [ -n "$AAPT2" ]; then
            "$AAPT2" dump badging "$APK" | head -n 30
          else
            echo "aapt2 not found"
            exit 1
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: yaas-android-arm64-debug
          path: build/app/outputs/flutter-apk/app-arm64-v8a-debug.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-arm64-${{ github.run_number }}
          name: YAAS Android ARM64 Build ${{ github.run_number }}
          body: |
            YAAS Android ARM64 debug build.

            Commit: ${{ github.sha }}

            Target architecture:
            arm64-v8a

            This build does not include the experimental bundled rclone.
          files: build/app/outputs/flutter-apk/app-arm64-v8a-debug.apk
          prerelease: true
          make_latest: false