
name: YAAS Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - android-port

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout
      - name: Checkout YAAS
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # 2. Java
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 3. Rust
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # 4. Rinf
      - name: Install Rinf CLI
        run: cargo install rinf_cli --locked

      # 5. Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # 6. Generate Android project
      - name: Generate Android project
        run: |
          flutter create \
            --platforms=android \
            --org com.yaas \
            .

      # 7. Add Internet permission
      - name: Add Android Internet permission
        shell: bash
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"

          if [ ! -f "$MANIFEST" ]; then
            echo "ERROR: AndroidManifest.xml not found"
            exit 1
          fi

          if ! grep -q 'android.permission.INTERNET' "$MANIFEST"; then
            sed -i '/<manifest[^>]*>/a\    <uses-permission android:name="android.permission.INTERNET" />' "$MANIFEST"
          fi

          grep -n 'android.permission.INTERNET' "$MANIFEST"

      # 8. Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: true

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses

      # 9. Android NDK
      - name: Install Android NDK
        run: |
          sdkmanager "ndk;28.2.13676358"

      # 10. Disable release Lint
      - name: Disable release Lint
        shell: bash
        run: |
          KTS="android/app/build.gradle.kts"
          GROOVY="android/app/build.gradle"

          if [ -f "$KTS" ]; then
            cat >> "$KTS" <<'EOF'

          android {
              lint {
                  checkReleaseBuilds = false
                  abortOnError = false
              }
          }
          EOF
          elif [ -f "$GROOVY" ]; then
            cat >> "$GROOVY" <<'EOF'

          android {
              lint {
                  checkReleaseBuilds false
                  abortOnError false
              }
          }
          EOF
          else
            echo "ERROR: Android Gradle file not found"
            exit 1
          fi

      # 11. Flutter dependencies
      - name: Get Flutter dependencies
        run: flutter pub get

      # 12. Generate Rinf bindings
      - name: Generate Rinf bindings
        run: rinf gen

      # 13. Check generated bindings
      - name: Check generated bindings
        run: |
          test -s lib/src/bindings/bindings.dart
          test -s lib/src/bindings/signals/signals.dart
          echo "Rinf bindings OK"

      # 14. Clean BEFORE generation
      - name: Flutter clean
        run: flutter clean

      # 15. Restore dependencies and bindings after clean
      - name: Restore dependencies and generate bindings
        run: |
          flutter pub get
          rinf gen

          test -s lib/src/bindings/bindings.dart
          test -s lib/src/bindings/signals/signals.dart

      # 16. Build RELEASE APK
      - name: Build release APK
        run: flutter build apk --release

      # 17. Check APK exists
      - name: Check APK exists
        shell: bash
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -s "$APK" ]; then
            echo "ERROR: APK was not created"
            find build -type f -name "*.apk" -print
            exit 1
          fi

          ls -lh "$APK"

      # 18. Verify Internet permission in APK
      - name: Verify Internet permission in APK
        shell: bash
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"

          AAPT2=$(find "$ANDROID_HOME/build-tools" \
            -type f -name "aapt2" | sort -V | tail -n 1)

          if [ -z "$AAPT2" ]; then
            echo "ERROR: aapt2 not found"
            exit 1
          fi

          "$AAPT2" dump permissions "$APK" | tee apk-permissions.txt

          if ! grep -Fq 'android.permission.INTERNET' apk-permissions.txt; then
            echo "ERROR: INTERNET permission missing"
            exit 1
          fi

          echo "INTERNET permission OK"

      # 19. Verify APK integrity
      - name: Verify APK integrity
        shell: bash
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"
          unzip -t "$APK"
          sha256sum "$APK"

      # 20. Verify APK signature
      - name: Verify APK signature
        shell: bash
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" \
            -type f -name "apksigner" | sort -V | tail -n 1)

          if [ -z "$APKSIGNER" ]; then
            echo "ERROR: apksigner not found"
            exit 1
          fi

          "$APKSIGNER" verify --verbose "$APK"

      # 21. Inspect APK
      - name: Inspect APK
        shell: bash
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"

          AAPT2=$(find "$ANDROID_HOME/build-tools" \
            -type f -name "aapt2" | sort -V | tail -n 1)

          "$AAPT2" dump badging "$APK"

      # 22. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: YAAS-Android-arm64
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      # 23. Create GitHub Release
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-release-${{ github.run_number }}
          name: YAAS Android Release ${{ github.run_number }}
          body: |
            YAAS Android Release
            Target: Android
            Build: Release APK
          files: |
            build/app/outputs/flutter-apk/app-release.apk
          prerelease: true
          make_latest: false
